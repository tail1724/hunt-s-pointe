name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # bun.lock resolves to Lovable's private registry (unreachable here),
      # so CI installs from package-lock.json via public npm.
      - run: npm ci
      # The repo carries ~420 pre-existing lint errors (see the build plan's
      # improvement list); keep lint visible but non-blocking until that
      # backlog is burned down, so it can't mask real test/build failures.
      - run: npm run lint
        continue-on-error: true
      - run: npm run test
      # `npm run build` shells out to bunx in its prebuild hook; run the same
      # two steps directly with npx instead.
      - run: npx tsx scripts/generate-sitemap.ts
      # The vendored Bible translations bundle into multi-MB JS chunks, which
      # pushes Rollup past Node's default ~2GB heap on the runner. Raise the
      # ceiling (ubuntu-latest has 16GB) so the production build completes.
      - run: npx vite build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  edge-functions:
    name: Typecheck edge functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: >
          deno check --config supabase/functions/_check/deno.json
          supabase/functions/prompt-partner/index.ts
          supabase/functions/prompt-partner/turn.test.ts
          supabase/functions/rag-retrieve/index.ts
          supabase/functions/help-assist/index.ts
          supabase/functions/help-assist/plan.test.ts
      - run: deno test --config supabase/functions/_check/deno.json supabase/functions/prompt-partner/turn.test.ts
      - run: deno test --config supabase/functions/_check/deno.json --allow-read supabase/functions/help-assist/plan.test.ts
